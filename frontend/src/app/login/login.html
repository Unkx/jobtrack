<mat-card class="login-card" appearance="outlined">
  <mat-card-header>
    <h1 mat-card-title>{{ mode() === 'login' ? 'Zaloguj się' : 'Załóż konto' }}</h1>
    <mat-card-subtitle>Wszystkie rekrutacje w jednym miejscu</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field>
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
        <mat-error>Wpisz adres w formacie nazwa&#64;domena.pl</mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Hasło</mat-label>
        <input
          matInput
          type="password"
          formControlName="password"
          [attr.autocomplete]="mode() === 'login' ? 'current-password' : 'new-password'"
        />
        @if (mode() === 'register') {
          <mat-hint>Co najmniej 8 znaków</mat-hint>
        }
        <mat-error>Hasło musi mieć od 8 do 72 znaków</mat-error>
      </mat-form-field>

      @if (error(); as message) {
        <p class="error" role="alert">{{ message }}</p>
      }

      <button matButton="filled" type="submit" [disabled]="submitting()">
        @if (submitting()) {
          {{ mode() === 'login' ? 'Logowanie…' : 'Tworzenie konta…' }}
        } @else {
          {{ mode() === 'login' ? 'Zaloguj się' : 'Załóż konto' }}
        }
      </button>
      <button matButton type="button" (click)="toggleMode()">
        {{ mode() === 'login' ? 'Nie masz konta? Załóż je' : 'Masz już konto? Zaloguj się' }}
      </button>
    </form>
  </mat-card-content>
</mat-card>
