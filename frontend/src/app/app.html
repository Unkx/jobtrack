<header class="topbar">
  <a class="brand" routerLink="/" aria-label="JobTrack – tablica">
    <span class="inset" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M5 12h13m-5-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" /></svg>
    </span>
    <span class="brand-name">JobTrack</span>
  </a>
  @if (auth.isLoggedIn()) {
    <nav aria-label="Główna nawigacja">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Tablica</a>
      <a routerLink="/stats" routerLinkActive="active">Statystyki</a>
    </nav>
  }
  <span class="spacer"></span>
  <button
    class="theme-toggle"
    type="button"
    (click)="theme.cycle()"
    [attr.aria-label]="themeLabel() + '. Kliknij, aby zmienić.'"
    [title]="themeLabel()"
  >
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
      @switch (theme.preference()) {
        @case ('light') {
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        }
        @case ('dark') {
          <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" />
        }
        @default {
          <circle cx="12" cy="12" r="8" />
          <path d="M12 4v16a8 8 0 0 0 0-16Z" fill="currentColor" />
        }
      }
    </svg>
  </button>
  @if (auth.isLoggedIn()) {
    <button class="logout" type="button" (click)="logout()">Wyloguj się</button>
  }
</header>

<main>
  <router-outlet />
</main>
